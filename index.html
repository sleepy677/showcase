<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase · 作品集</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6b66;
    --line: #e6e6e1;
    --accent: #2f6f4e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 72px 24px 96px; }
  header { margin-bottom: 56px; }
  .kicker {
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 14px;
  }
  h1 {
    font-size: 40px; line-height: 1.2; margin: 0 0 16px;
    letter-spacing: -.02em; font-weight: 700;
  }
  .lead { font-size: 17px; color: var(--muted); margin: 0; max-width: 56ch; }
  h2 {
    font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
    margin: 48px 0 20px; padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .grid { display: grid; gap: 14px; }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px 22px;
    transition: border-color .18s ease, transform .18s ease;
  }
  .card:hover { border-color: #c9c9c2; transform: translateY(-1px); }
  .card-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .card-desc { font-size: 14px; color: var(--muted); margin: 0; }
  .empty {
    background: var(--card); border: 1px dashed var(--line);
    border-radius: 10px; padding: 32px 22px; text-align: center;
    color: var(--muted); font-size: 14px;
  }
  code {
    background: #eeeee9; padding: 2px 6px; border-radius: 4px;
    font-size: 13px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  footer {
    margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  @media (max-width: 560px) {
    .wrap { padding: 48px 20px 72px; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">Showcase</div>
    <h1>我的作品集</h1>
    <p class="lead">这里收集我做过的东西——项目、设计、写下的文字。持续更新中。</p>
  </header>

  <h2>项目</h2>
  <div class="grid">
    <a class="card" href="projects/motion-trajectory/">
      <div class="card-title">运动轨迹</div>
      <p class="card-desc">p5.js 交互作品 · 鼠标划过海面，激起一圈圈扩散消散的涟漪</p>
    </a>
    <a class="card" href="projects/geometric-composition/">
      <div class="card-title">几何构成</div>
      <p class="card-desc">p5.js 生成的程序化几何图形 · 圆与方块按网格交替排布，颜色随坐标连续过渡</p>
    </a>
  </div>

  <h2>关于</h2>
  <div class="grid">
    <div class="card" style="cursor:default">
      <div class="card-title">怎么添加作品</div>
      <p class="card-desc">
        在仓库里新建 <code>projects/作品名/</code> 目录，放入文件，提交并推送。
        如果作品是网页，可以放进目录后直接访问对应路径预览。
      </p>
    </div>
  </div>

  <footer>
    <span>© <span id="year">2026</span> sleepy677</span>
    <a href="https://github.com/sleepy677/showcase">GitHub 仓库</a>
  </footer>

</div>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
